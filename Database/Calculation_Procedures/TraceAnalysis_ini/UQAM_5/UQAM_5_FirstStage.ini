% Revisions:
%
% 19 October 2026 (David Trejo)
%   - First version for UQAM_5 not tested yet! (Saint-Francois du Lac Natural Marsh, CA-CQ5).
%
%       SITE-SPECIFIC CAVEATS  -------------------------------------------------
%     - The marsh floods every spring (up to 3 m).  During floods the SnowVUE
%       sees the water surface, so D_SNOW is not snow depth then, and soil
%       sensors and HFP01 are under water.  Handle in second/third stage.
%     - WS_Avg / WD_Std are the only wind names at this site (no pre-August
%       2024 names), so no alternate inputFileName is needed.

Site_name = 'Saint-Francois du Lac Natural Marsh'
SiteID = 'UQAM_5'

Difference_GMT_to_local_time = 5    % hours (GMT - PST)
Timezone = 5                        % hours

%---------------------------------------
% Global variables (instrument-specific)
%--------------------------------------- 
% The instrument traces will all need to have the same 
% instrumentType field 'LI7200', 'LI7700'...
% and come from the same software (EddyPro)
