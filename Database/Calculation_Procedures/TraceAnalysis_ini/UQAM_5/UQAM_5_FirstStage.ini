globalVars.Instrument.IRGA.instrument                   = 'LI-7200'
globalVars.Instrument.IRGA.instrumentSN                 = '72H-1209'
globalVars.Instrument.IRGA.inputFileName_dates          = [ datenum(2026,8,6,16,0,0) datenum(2999,12,31)]

