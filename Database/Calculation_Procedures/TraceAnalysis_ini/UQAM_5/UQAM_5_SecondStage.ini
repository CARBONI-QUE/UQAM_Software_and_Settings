%
% Second stage ini_file for UQAM_5
%
% Oct 19, 2026 David Trejo
%

% Revisions:
%
% October 19, 2026 (David Trejo)
%   - First version for UQAM_5.  Differences from UQAM_2:
%     - No water probes yet (EasyProbe/CS456), so no COND/DO/ORP/pH/TW/WTD/Salinity.
%     - Heights: HygroVUE10 upper 4.85 m (TA/RH_1_1_1), lower 3.5 m (_1_2_1);
%       RM Young 05103 at 5 m, CNR4 at 4.8 m.
%     - Soil: five horizontal CS650 replicas at 8 cm (_1_1_1 and _2_1_1.._5_1_1)
%       and a profile at 8/16/32/64 cm (_1_1_1.._1_4_1) installed 2026-10-15.
%       TS_1 = TS_1_1_1 (8 cm) covers the whole record, as at the other sites;
%       TS_2..TS_4 and SWC_1_2_1..SWC_1_4_1 start 2026-10-15 10:22 EST.
%       _1_1_1 changed location on 2026-10-15 (moved into the profile pit),
%       so a level shift is expected there.
%     - G_1 is the mean of the four HFP01 (8 cm).  Before 2026-10-15 some
%       plates were uncovered or upside down (reinstalled on that visit), so
%       G before then is questionable, kept for now (see first stage header).
%     - RH gap filling uses the default qaqc thresholds (r2min/minSlope 0.95).
%       UQAM_2 needed lower values, to be considered once there is enough
%       UQAM_5 data to judge the fits.
%     - wind_dir units were 'm/s' in the template, fixed to degrees.
%   - Gap filling of TA/RH/PA uses the ECCC station of MCGILL_1 (Nicolet,
%     ID 10732), set in the first stage file.
%   - Flooding: the marsh floods every spring.  D_SNOW is passed through
%     as is, during floods it reads the water surface and should be killed
%     or flagged once the flood dates are known.

Site_name = 'Saint-Francois du Lac Natural Marsh'
SiteID = 'UQAM_5'
input_path    = ''
output_path   = '' 
high_level_path = {}
searchPath = 'auto'
 
% create a generic trace and variables
% the variables created here will be available to all other traces below
[Trace]
	variableName 	= 'all_nan'
	Evaluate 		= 'all_nan = nan(size(clean_tv));
                		processingYear = yearIn;'
	title 			= 'definitions of a all_nan trace and some global variables'
	units 			= ''
[End]

% ----------------------------------------------------------------------------
% Misc. important variables - temperature, pressure etc.
% ----------------------------------------------------------------------------

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'TA_1_1_1'
	Evaluate        = 'TA_1_1_1 = TA_1_1_1;'
	title           = 'Air temperature at 4.85m (HygroVUE10)'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TA_1_2_1'
	Evaluate        = 'TA_1_2_1 = TA_1_2_1;'
	title           = 'Air temperature at 3.5m (HygroVUE10)'
	units           = '^oC'
[End]

% gap-filled TA
[Trace]
	variableName    = 'TA_F_1_1_1'
	Evaluate        = 'TA_F_1_1_1 = gapFillUsingAltSensor(TA_1_1_1,TA_ECCC,[],[],[],"TA_F_1_1_1");'
	title           = 'Air temperature at 4.85m gap-filled using ECCC climate station data'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TA_F_1_2_1'
	Evaluate        = 'TA_F_1_2_1 = gapFillUsingAltSensor(TA_1_2_1,TA_ECCC,[],[],[],"TA_F_1_2_1");'
	title           = 'Air temperature at 3.5m gap-filled using ECCC climate station data'
	units           = '^oC'
[End]

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'RH_1_1_1'
	Evaluate        = 'RH_1_1_1 = RH_1_1_1;'
	title           = 'RH at 4.85m (HygroVUE10)'
	units           = '%'
[End]

[Trace]
	variableName    = 'RH_1_2_1'
	Evaluate        = 'RH_1_2_1 = RH_1_2_1;'
	title           = 'RH at 3.5m (HygroVUE10)'
	units           = '%'
[End]

% gap-filled RH (default r2min/minSlope; check the fit plots)
[Trace]
	variableName    = 'RH_F_1_1_1'
	Evaluate        = 'qaqcIn=[]; 
                        qaqcIn.polyfitWithoutClamped = 2;
                        qaqcIn.clamped_minMax = [0,100];
                        [RH_F_1_1_1, qaqcOut] = gapFillUsingAltSensor(RH_1_1_1,RH_ECCC,[],qaqcIn,1,"RH_F_1_1_1 with ECCC");'
	title           = 'RH at 4.85m gap-filled using ECCC climate station data'
	units           = '%'
[End]

[Trace]
	variableName    = 'RH_F_1_2_1'
	Evaluate        = 'qaqcIn=[]; 
                        qaqcIn.polyfitWithoutClamped = 2;
                        qaqcIn.clamped_minMax = [0,100];
                        [RH_F_1_2_1, qaqcOut] = gapFillUsingAltSensor(RH_1_2_1,RH_ECCC,[],qaqcIn,1,"RH_F_1_2_1 with ECCC");'
	title           = 'RH at 3.5m gap-filled using ECCC climate station data'
	units           = '%'
[End]

% pass through/derive unfilled variables for Ameriflux
[Trace]
	variableName    = 'VPD_1_1_1'
	Evaluate        = 'VPD_1_1_1 = vapPressDeficit(TA_1_1_1,RH_1_1_1);'
	title           = 'Vapour pressure deficit (from 4.85m HygroVUE10)'
	units           = 'hPa'
[End]

[Trace]
	variableName    = 'VPD_1_2_1'
	Evaluate        = 'VPD_1_2_1 = vapPressDeficit(TA_1_2_1,RH_1_2_1);'
	title           = 'Vapour pressure deficit (from 3.5m HygroVUE10)'
	units           = 'hPa'
[End]

% gap-filled VPD (used by the third stage config: Fill_Vars and REddyProc vars_in)
[Trace]
	variableName    = 'VPD_F_1_1_1'
	Evaluate        = 'VPD_F_1_1_1 = vapPressDeficit(TA_F_1_1_1,RH_F_1_1_1);'
	title           = 'Vapour pressure deficit (from 4.85m), from gap-filled TA and RH'
	units           = 'hPa'
[End]

[Trace]
	variableName    = 'VPD_F_1_2_1'
	Evaluate        = 'VPD_F_1_2_1 = vapPressDeficit(TA_F_1_2_1,RH_F_1_2_1);'
	title           = 'Vapour pressure deficit (from 3.5m), from gap-filled TA and RH'
	units           = 'hPa'
[End]

% ----------------------------------------------------------------------------
% Soil
% ----------------------------------------------------------------------------

% Profile: TS_1 / _1_1_1 cover the whole record, deeper levels from 2026-10-15 10:22 EST
[Trace]
	variableName    = 'TS_1'
	Evaluate        = 'TS_1 = TS_1_1_1;'
	title           = 'soil temperature at 8cm depth (profile)'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TS_2'
	Evaluate        = 'TS_2 = TS_1_2_1;'
	title           = 'soil temperature at 16cm depth (profile)'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TS_3'
	Evaluate        = 'TS_3 = TS_1_3_1;'
	title           = 'soil temperature at 32cm depth (profile)'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TS_4'
	Evaluate        = 'TS_4 = TS_1_4_1;'
	title           = 'soil temperature at 64cm depth (profile)'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'SWC_1_1_1'
	Evaluate        = 'SWC_1_1_1 = SWC_1_1_1;'
	title           = 'soil water content at 8cm (profile)'
	units           = '%'
[End]

[Trace]
	variableName    = 'SWC_1_2_1'
	Evaluate        = 'SWC_1_2_1 = SWC_1_2_1;'
	title           = 'soil water content at 16cm (profile)'
	units           = '%'
[End]

[Trace]
	variableName    = 'SWC_1_3_1'
	Evaluate        = 'SWC_1_3_1 = SWC_1_3_1;'
	title           = 'soil water content at 32cm (profile)'
	units           = '%'
[End]

[Trace]
	variableName    = 'SWC_1_4_1'
	Evaluate        = 'SWC_1_4_1 = SWC_1_4_1;'
	title           = 'soil water content at 64cm (profile)'
	units           = '%'
[End]

% Horizontal replicas at 8 cm (_5_1_1 from 2026-10-15 10:12 EST)
[Trace]
	variableName    = 'SWC_2_1_1'
	Evaluate        = 'SWC_2_1_1 = SWC_2_1_1;'
	title           = 'soil water content at 8cm - replica 2'
	units           = '%'
[End]

[Trace]
	variableName    = 'TS_2_1_1'
	Evaluate        = 'TS_2_1_1 = TS_2_1_1;'
	title           = 'soil temperature at 8cm - replica 2'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'SWC_3_1_1'
	Evaluate        = 'SWC_3_1_1 = SWC_3_1_1;'
	title           = 'soil water content at 8cm - replica 3'
	units           = '%'
[End]

[Trace]
	variableName    = 'TS_3_1_1'
	Evaluate        = 'TS_3_1_1 = TS_3_1_1;'
	title           = 'soil temperature at 8cm - replica 3'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'SWC_4_1_1'
	Evaluate        = 'SWC_4_1_1 = SWC_4_1_1;'
	title           = 'soil water content at 8cm - replica 4'
	units           = '%'
[End]

[Trace]
	variableName    = 'TS_4_1_1'
	Evaluate        = 'TS_4_1_1 = TS_4_1_1;'
	title           = 'soil temperature at 8cm - replica 4'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'SWC_5_1_1'
	Evaluate        = 'SWC_5_1_1 = SWC_5_1_1;'
	title           = 'soil water content at 8cm - replica 5'
	units           = '%'
[End]

[Trace]
	variableName    = 'TS_5_1_1'
	Evaluate        = 'TS_5_1_1 = TS_5_1_1;'
	title           = 'soil temperature at 8cm - replica 5'
	units           = '^oC'
[End]

% Soil heat flux (questionable before the 2026-10-15 reinstallation, see first stage)
[Trace]
	variableName    = 'G_1_1_1'
	Evaluate        = 'G_1_1_1 = G_1_1_1;'
	title           = 'soil heat flux at 8cm - plate 1 (HFP01 SN 23111)'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'G_2_1_1'
	Evaluate        = 'G_2_1_1 = G_2_1_1;'
	title           = 'soil heat flux at 8cm - plate 2 (HFP01 SN 23112)'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'G_3_1_1'
	Evaluate        = 'G_3_1_1 = G_3_1_1;'
	title           = 'soil heat flux at 8cm - plate 3 (HFP01 SN 23113)'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'G_4_1_1'
	Evaluate        = 'G_4_1_1 = G_4_1_1;'
	title           = 'soil heat flux at 8cm - plate 4 (HFP01 SN 23114)'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'G_1'
	Evaluate        = 'G_1 = mean([G_1_1_1, G_2_1_1, G_3_1_1, G_4_1_1],2,"omitnan");'
	title           = 'soil heat flux at 8cm depth (mean of 4 HFP01)'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'D_SNOW'
	Evaluate        = 'D_SNOW = D_SNOW;'
	title           = 'snow depth (SnowVUE10, 4.00 m above ground; water surface during floods)'
	units           = 'cm'
[End]

% ----------------------------------------------------------------------------
% Radiation
% ----------------------------------------------------------------------------

[Trace]
	variableName    = 'SW_IN_1_1_1'
	Evaluate        = 'SW_IN_1_1_1 = SW_IN_1_1_1;'
	title           = 'incoming shortwave radiation by CNR4'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'SW_OUT_1_1_1'
	Evaluate        = 'SW_OUT_1_1_1 = SW_OUT_1_1_1;'
	title           = 'reflected shortwave radiation by CNR4'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'LW_IN_1_1_1'
	Evaluate        = 'LW_IN_1_1_1 = LW_IN_1_1_1;'
	title           = 'incoming long wave radiation by CNR4'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'LW_OUT_1_1_1'
	Evaluate        = 'LW_OUT_1_1_1 = LW_OUT_1_1_1;'
	title           = 'outgoing long wave radiation by CNR4'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'RG_1_1_1'
	Evaluate        = 'RG_1_1_1 = SW_IN_1_1_1+LW_IN_1_1_1;'
	title           = 'Global Radiation - total incoming SW & LW'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'NETRAD_1_1_1'
	Evaluate        = 'NETRAD_1_1_1 = calcNetRad(SW_IN_1_1_1,SW_OUT_1_1_1,LW_IN_1_1_1,LW_OUT_1_1_1);'
	title           = 'net radiation by CNR4'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'ALB_1_1_1'
	Evaluate        = 'ALB_1_1_1 = calcAlb(SW_IN_1_1_1,SW_OUT_1_1_1);'
	title           = 'albedo by CNR4'
	units           = '%'
[End]

[Trace]
	variableName    = 'PPFD_IN_1_1_1'
	Evaluate        = 'PPFD_IN_1_1_1 = PPFD_IN_1_1_1;'
	title           = 'incoming PAR (SQ-521)'
	units           = '\mu mol/m^2/s'
[End]

[Trace]
	variableName    = 'PPFD_OUT_1_1_1'
	Evaluate        = 'PPFD_OUT_1_1_1 = PPFD_OUT_1_1_1;'
	title           = 'reflected PAR (SQ-521)'
	units           = '\mu mol/m^2/s'
[End]

% ----------------------------------------------------------------------------
% Pressure, precipitation, wind
% ----------------------------------------------------------------------------

[Trace]
	variableName    = 'PA_1_1_1'
	Evaluate        = 'PA_1_1_1 = PA_1_1_1;'
	title           = 'air pressure by BaroVUE10'
	units           = 'kPa'
[End]

[Trace]
	variableName    = 'PA_F_1_1_1'
	Evaluate        = 'PA_F_1_1_1 = gapFillUsingAltSensor(PA_1_1_1,PA_ECCC,[],[], [],"PA_F_1_1_1");'
	title           = 'air pressure by BaroVUE10, gap-filled using ECCC climate station data'
	units           = 'kPa'
[End]

[Trace]
	variableName    = 'P_RAIN_1_1_1'
	Evaluate        = 'P_RAIN_1_1_1 = P_RAIN_1_1_1;'
	title           = 'precipitation (TE525WS tipping bucket)'
	units           = 'mm'
[End]

% gap-filled P_RAIN: not attempted (low r2 with ECCC at the other sites)
[Trace]
	variableName    = 'WS_1_1_1'
	Evaluate        = 'WS_1_1_1 = WS_1_1_1;'
	title           = 'wind speed by RM Young 05103 at 5m'
	units           = 'm/s'
[End]

[Trace]
	variableName    = 'WD_1_1_1'
	Evaluate        = 'WD_1_1_1 = WD_1_1_1;'
	title           = 'wind direction by RM Young 05103 at 5m'
	units           = 'degrees'
[End]

[Trace]
	variableName    = 'wind_speed'
	Evaluate        = 'wind_speed = WS;'
	title           = 'Mean wind speed (CSAT3B)'
	units           = 'm/s'
[End]

[Trace]
	variableName    = 'wind_dir'
	Evaluate        = 'wind_dir = wind_dir;'
	title           = 'Direction from which the wind blows, with respect to Geographic or Magnetic north (CSAT3B)'
	units           = 'degrees'
[End]

% ----------------------------------------------------------------------------
% Turbulent fluxes LI-7200 & LI-7700
% ----------------------------------------------------------------------------

[Trace]
	variableName    = 'CO2'
	Evaluate        = 'CO2 = CO2;'
	title           = 'CO2 in mole fraction of wet air'
	units           = '\mu mol / mol wet air'
[End]

[Trace]
	variableName    = 'H2O'
	Evaluate        = 'H2O = H2O;'
	title           = 'H2O in mole fraction of wet air'
	units           = 'mm mol / mol wet air'
[End]

[Trace]
	variableName    = 'CH4'
	Evaluate        = 'CH4 = CH4;'
	title           = 'CH4 in mole fraction of wet air'
	units           = 'nmol / mol wet air'
[End]

[Trace]
	variableName    = 'w_ts_cov'
	Evaluate        = 'w_ts_cov = w_ts_cov;'
	title           = 'Covariance of w and sonic temperature (Sonic, after rotation)'
	units           = 'm/s degK'
[End]

[Trace]
	variableName    = 'w_h2o_cov'
	Evaluate        = 'w_h2o_cov = w_h2o_cov;'
	title           = 'Covariance of w and water vapour mixing ratio (after rotation)'
	units           = 'm/s mmol/mol'
[End]

[Trace]
	variableName    = 'w_co2_cov'
	Evaluate        = 'w_co2_cov = w_co2_cov;'
	title           = 'Covariance of w and CO2 (after rotation)'
	units           = 'm/s umol/mol'
[End]

[Trace]
	variableName    = 'w_ch4_cov'
	Evaluate        = 'w_ch4_cov = w_ch4_cov;'
	title           = 'Covariance of w and CH4 (after rotation)'
	units           = 'm/s nmol/mol'
[End]

[Trace]
	variableName    = 'LE'
	Evaluate        = 'LE = LE;'
	title           = 'Latent Heat Flux'
	units           = 'W m^{-2}'
[End]

[Trace]
	variableName    = 'SLE'
	Evaluate        = 'SLE = SLE;'
	title           = 'Estimate of storage latent heat flux'
	units           = 'W m^{-2}'
[End]

[Trace]
	variableName    = 'H'
	Evaluate        = 'H = H;'
	title           = 'sensible heat flux'
	units           = 'W m^{-2}'
[End]

[Trace]
	variableName    = 'SH'
	Evaluate        = 'SH = SH;'
	title           = 'Estimate of storage sensible heat flux'
	units           = 'W m^{-2}'
[End]

[Trace]
	variableName    = 'FC'
	Evaluate        = 'FC = FC;'
	title           = 'CO_2 Flux'
	units           = '\mu mol m^{-2} s^{-1}'
[End]

[Trace]
	variableName    = 'SC'
	Evaluate        = 'SC = SC;'
	title           = 'Estimate of storage CO2 flux'
	units           = 'umol/m^2/s'
[End]

[Trace]
	variableName    = 'FCH4'
	Evaluate        = 'FCH4 = FCH4;'
	title           = 'CH_4 Flux'
	units           = 'nmol m^{-2} s^{-1}'
[End]

[Trace]
	variableName    = 'SCH4'
	Evaluate        = 'SCH4 = SCH4;'
	title           = 'Estimate of storage CH4 flux'
	units           = 'nmol m^{-2} s^{-1}'
[End]

[Trace]
	variableName    = 'USTAR'
	Evaluate        = 'USTAR = USTAR;'
	title           = 'Friction Velocity'
	units           = 'm/s'
[End]

[Trace]
	variableName    = 'TKE'
	Evaluate        = 'TKE = TKE;'
	title           = 'Turbulent kinetic energy'
	units           = 'm2 s-2'
[End]

[Trace]
	variableName    = 'L'
	Evaluate        = 'L = L;'
	title           = 'Monin-Obukhov length'
	units           = 'm'
[End]

[Trace]
	variableName    = 'U_SIGMA'
	Evaluate        = 'U_SIGMA = sqrt(u_var);'
	title           = 'Standard deviation of velocity fluctuations'
	units           = 'm s-1'
[End]

[Trace]
	variableName    = 'V_SIGMA'
	Evaluate        = 'V_SIGMA = sqrt(v_var);'
	title           = 'Standard deviation of lateral velocity fluctuations'
	units           = 'm s-1'
[End]

[Trace]
	variableName    = 'W_SIGMA'
	Evaluate        = 'W_SIGMA = sqrt(w_var);'
	title           = 'Standard deviation of vertical velocity fluctuations'
	units           = 'm s-1'
[End]

[Trace]
	variableName    = 'TAU'
	Evaluate        = 'TAU = TAU;'
	title           = 'Corrected momentum flux'
	units           = 'kg m-1 s-2'
[End]

[Trace]
	variableName    = 'zdL'
	Evaluate        = 'zdL = zdL;'
	title           = 'Monin-Obukhov stability parameter. EddyPro output name: (z-d)/L'
	units           = 'dimensionless'
[End]

[Trace]
	variableName    = 'T_SONIC'
	Evaluate        = 'T_SONIC = T_SONIC;'
	title           = 'Mean temperature of ambient air as measured by the anemometer'
	units           = 'C'
	minMax          = [-40,50]
[End]

% ----------------------------------------------------------------------------
% Misc Meteorological variables
% ----------------------------------------------------------------------------

[Trace]
	variableName    = 'aerodynamic_resistance_momentum'
	Evaluate        = '[ga_m_vel, ga_h_vel] = calc_aerodynamic_conductance(WS_1_1_1,USTAR,zdL);
                        aerodynamic_resistance_momentum = 1./ga_m_vel;'
	title           = 'Aerodynamic resistance for momentum'
	units           = 's m^{-1}'
[End]

[Trace]
	variableName    = 'aerodynamic_resistance_scalar'
	Evaluate        = '[ga_m_vel, ga_h_vel] = calc_aerodynamic_conductance(WS_1_1_1,USTAR,zdL);
                        aerodynamic_resistance_scalar = 1./ga_h_vel;'
	title           = 'Aerodynamic resistance for heat and water vapour'
	units           = 's m^{-1}'
[End]

[Trace]
	variableName    = 'surface_conductance'
	Evaluate        = 'available_energy = (NETRAD_1_1_1 - G_1); % could better estimate storage terms for G
                       surface_conductance = calc_surface_conductance_as_flx(TA_1_1_1,...
                        RH_1_1_1, aerodynamic_resistance_scalar, available_energy,...
                        LE, PA_1_1_1);'
	title           = 'Surface conductance'
	units           = 'mol m^{-2} s^{-1}'
[End]
